version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfiles (pinned by digest — keep the pins fresh).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/test/tools/issuer"
      - "/test/tools/fake-apiserver"
      - "/test/tools/audit-webhook"
    schedule:
      interval: "weekly"

  # The website (Astro Starlight) in website/. Framework bumps arrive as one PR.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-*"
          - "astro-mermaid"
