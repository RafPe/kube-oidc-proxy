name: helm-chart

on:
  push:
    branches:
      - 'main'
    paths:
      - 'chart/kube-oidc-proxy/**'
      - '.github/workflows/helm.yaml'
      - 'hack/verify-chart-logging.sh'
      - 'hack/verify-chart-rbac.sh'
      - 'hack/verify-chart-namespace.sh'
      - 'hack/verify-chart-metrics.sh'
      - 'hack/verify-chart-dashboards.sh'
  pull_request:
    paths:
      - 'chart/kube-oidc-proxy/**'
      - '.github/workflows/helm.yaml'
      - 'hack/verify-chart-logging.sh'
      - 'hack/verify-chart-rbac.sh'
      - 'hack/verify-chart-namespace.sh'
      - 'hack/verify-chart-metrics.sh'
      - 'hack/verify-chart-dashboards.sh'

permissions:
  contents: read

concurrency:
  # Cancel superseded pull request runs; never cancel a run on main or a
  # scheduled run, whose results are recorded against the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-template:
    name: "test:chart"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHART: chart/kube-oidc-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hack/verify-chart-dashboards.sh builds the pinned dashboard-linter from
      # source, so this job needs a Go toolchain and it must be the one the
      # repository builds with - not whatever the runner image happens to ship.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint (single-issuer fixture)
        run: helm lint "$CHART" -f "$CHART/ci/single-issuer-values.yaml"

      - name: helm lint (multi-issuer fixture)
        run: helm lint "$CHART" -f "$CHART/ci/multi-issuer-values.yaml"

      - name: helm template (single-issuer fixture)
        run: helm template ci-single "$CHART" -f "$CHART/ci/single-issuer-values.yaml" > /dev/null

      - name: helm template (multi-issuer fixture)
        run: helm template ci-multi "$CHART" -f "$CHART/ci/multi-issuer-values.yaml" > /dev/null

      - name: helm lint (metrics fixture)
        run: helm lint "$CHART" -f "$CHART/ci/metrics-values.yaml"

      - name: helm template (metrics fixture)
        run: helm template ci-metrics "$CHART" -f "$CHART/ci/metrics-values.yaml" > /dev/null

      - name: metrics values render the listener, the Service and the monitors
        run: bash hack/verify-chart-metrics.sh

      # The linter version is read out of the script rather than repeated
      # here, so the cache key and the binary the script builds can never name
      # different versions.
      - name: Read the pinned dashboard-linter version
        id: linter
        run: |
          version="$(sed -n 's/^LINTER_VERSION="\(.*\)"$/\1/p' hack/verify-chart-dashboards.sh)"
          [ -n "$version" ] || { echo "::error::no LINTER_VERSION in hack/verify-chart-dashboards.sh"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The script reuses bin/dashboard-linter-<version> when it is already
      # there, so caching it turns the clone-and-build into a once-per-version
      # cost rather than a per-run one.
      - name: Cache the pinned dashboard linter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/dashboard-linter-${{ steps.linter.outputs.version }}
          key: dashboard-linter-${{ runner.os }}-${{ runner.arch }}-${{ steps.linter.outputs.version }}

      # Needs git and network on a cache miss: the pinned dashboard-linter
      # cannot be run with `go run <module>@<version>` because its go.mod
      # carries a replace directive, so the script builds the pinned tag from a
      # shallow clone.
      - name: dashboards are valid, linted and rendered byte-for-byte
        run: bash hack/verify-chart-dashboards.sh

      - name: logging values render as proxy flags
        run: bash hack/verify-chart-logging.sh

      - name: ClusterRole grants every declared userextras key
        run: bash hack/verify-chart-rbac.sh

      - name: namespaced objects carry the release namespace
        run: bash hack/verify-chart-namespace.sh

      - name: default image tag follows appVersion
        # The release pipeline sets appVersion from the git tag; the chart must
        # deploy that image unless image.tag is explicitly overridden.
        run: |
          app_version="$(yq -r .appVersion "$CHART/Chart.yaml")"
          render_image() {
            helm template ci-single "$CHART" -f "$CHART/ci/single-issuer-values.yaml" "$@" \
              --show-only templates/deployment.yaml | yq -r '.spec.template.spec.containers[0].image'
          }
          rendered="$(render_image)"
          [ "$rendered" = "ghcr.io/rafpe/kube-oidc-proxy:${app_version}" ] || { echo "::error::rendered ${rendered}, expected appVersion ${app_version}"; exit 1; }
          rendered="$(render_image --set image.tag=9.9.9)"
          [ "$rendered" = "ghcr.io/rafpe/kube-oidc-proxy:9.9.9" ] || { echo "::error::image.tag override not honoured: ${rendered}"; exit 1; }
