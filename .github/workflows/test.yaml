name: test

# Build, unit tests, vet, gofmt and lint. Gates PRs and pushes to main.
# (e2e runs in e2e.yaml.)
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel superseded pull request runs; never cancel a run on main or a
  # scheduled run, whose results are recorded against the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "test:unit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate mocks
        run: go run go.uber.org/mock/mockgen -package=mocks -destination pkg/mocks/authenticator.go k8s.io/apiserver/pkg/authentication/authenticator Token

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # e2e packages need Docker + kind and run in e2e.yaml; run unit tests for
      # the maintained cmd/ and pkg/ packages here, plus the standalone test
      # tools, which need no cluster.
      - name: go test
        run: go test ./cmd/... ./pkg/... ./test/tools/... ./test/e2e/versions/...

      # e2e.yaml runs the suite as three label-filtered shards; an unlabelled
      # case would run in none of them. Cheap text check, no cluster needed.
      - name: Verify e2e shard labels
        run: make verify-e2e-shards

  lint:
    name: "lint:go"
    # golangci-lint carries pre-existing findings across the repo that are being
    # retired incrementally, so gate on issues introduced by the PR. This makes
    # the linter enforce cleanliness going forward without blocking on legacy
    # debt. Runs on PRs where a base ref is available to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate mocks
        run: go run go.uber.org/mock/mockgen -package=mocks -destination pkg/mocks/authenticator.go k8s.io/apiserver/pkg/authentication/authenticator Token

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout 5m
          only-new-issues: true
