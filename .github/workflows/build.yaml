name: build

# Publishes a mutable development image to GHCR on every push to main
# (:edge and :main-<sha>) for testing unreleased changes. Versioned, immutable
# releases (:X.Y.Z and :latest) are published by release-image.yaml from a git
# tag. Tests run in test.yaml / e2e.yaml.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel superseded pull request runs; never cancel a run on main or a
  # scheduled run, whose results are recorded against the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: "build:image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # cosign keyless signing
      packages: write # push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build binaries (amd64 + arm64) and compute tags
        run: |
          set -euo pipefail
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=main-$(echo "$GITHUB_SHA" | cut -c1-6)" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "-w $(hack/version-ldflags.sh)" \
              -o "bin/${arch}/kube-oidc-proxy" ./cmd/.
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.TAG }}
            ghcr.io/${{ env.REPO }}:edge

      - name: Sign image (keyless, by digest)
        env:
          REPO: ${{ env.REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign -y "ghcr.io/${REPO}@${DIGEST}"

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ env.REPO }}:${{ env.TAG }}
          format: spdx-json
          output-file: /tmp/sbom.spdx.json

      - name: Attach SBOM to image
        continue-on-error: true
        env:
          REPO: ${{ env.REPO }}
          TAG: ${{ env.TAG }}
        run: cosign attach sbom --sbom /tmp/sbom.spdx.json "ghcr.io/${REPO}:${TAG}"
