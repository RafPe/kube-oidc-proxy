name: build

# Publishes a mutable development image to GHCR on every push to main
# (:edge and :main-<sha>) for testing unreleased changes. Versioned, immutable
# releases (:X.Y.Z and :latest) are published by release-image.yaml from a git
# tag. Tests run in test.yaml / e2e.yaml.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # cosign keyless signing
  packages: write # push to ghcr.io

env:
  GO_VERSION: "1.26.5"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Build binaries (amd64 + arm64) and compute tags
        run: |
          set -euo pipefail
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=main-$(echo "$GITHUB_SHA" | cut -c1-6)" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "-w $(hack/version-ldflags.sh)" \
              -o "bin/${arch}/kube-oidc-proxy" ./cmd/.
          done

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.TAG }}
            ghcr.io/${{ env.REPO }}:edge

      - name: Sign image (keyless, by digest)
        env:
          REPO: ${{ env.REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign -y "ghcr.io/${REPO}@${DIGEST}"

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ env.REPO }}:${{ env.TAG }}
          format: spdx-json
          output-file: /tmp/sbom.spdx.json

      - name: Attach SBOM to image
        continue-on-error: true
        env:
          REPO: ${{ env.REPO }}
          TAG: ${{ env.TAG }}
        run: cosign attach sbom --sbom /tmp/sbom.spdx.json "ghcr.io/${REPO}:${TAG}"
