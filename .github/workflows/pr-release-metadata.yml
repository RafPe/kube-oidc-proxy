name: PR Release Metadata

# Enforces the release metadata consumed by Prepare Release.
on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Cancel superseded pull request runs; never cancel a run on main or a
  # scheduled run, whose results are recorded against the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-label:
    name: "meta:release-label"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release label and changelog fragments
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED_FILES_URL: ${{ github.event.pull_request.url }}/files?per_page=100
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${HEAD_BRANCH}" = "release/next" ] && [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] && \
             echo "${LABELS_JSON}" | jq -e 'index("autorelease: pending") != null' >/dev/null; then
            echo "Generated release PR metadata is valid."
            exit 0
          fi
          count=$(echo "${LABELS_JSON}" | jq '[.[] | select(. == "release/major" or . == "release/minor" or . == "release/patch" or . == "release/skip")] | length')
          [ "${count}" -eq 1 ] || { echo "::error::exactly one release label is required (found ${count})."; exit 1; }
          label=$(echo "${LABELS_JSON}" | jq -r '.[] | select(. == "release/major" or . == "release/minor" or . == "release/patch" or . == "release/skip")')
          fragment_files=$(gh api --paginate "${CHANGED_FILES_URL}" --jq '.[] | select(.status != "removed" and (.filename | startswith(".changes/unreleased/") and endswith(".yaml"))) | .filename')
          fragments=$(printf '%s\n' "${fragment_files}" | sed '/^$/d' | wc -l | tr -d ' ')
          printf '%s\n' "${fragment_files}" | while IFS= read -r fragment; do
            [ -n "${fragment}" ] || continue
            kind=$(yq -r '.kind // ""' "${fragment}")
            body=$(yq -r '.body // ""' "${fragment}")
            echo "${kind}" | grep -Eq '^(Added|Changed|Deprecated|Removed|Fixed|Security|Dependencies)$' || { echo "::error::${fragment} has unsupported kind"; exit 1; }
            [ -n "${body}" ] || { echo "::error::${fragment} has an empty body"; exit 1; }
          done
          if [ "${label}" = "release/skip" ]; then
            [ "${fragments}" -eq 0 ] || { echo "::error::release/skip PRs must not add changelog fragments."; exit 1; }
          else
            [ "${fragments}" -gt 0 ] || { echo "::error::Non-skip PRs require a .changes/unreleased/*.yaml fragment."; exit 1; }
          fi
          echo "Release metadata check passed."
