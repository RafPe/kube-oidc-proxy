name: helm-release

# Manual for now (workflow_dispatch). Once the flow is proven we can add
# automatic triggers (e.g. on a chart-version bump or a git tag).
on:
  workflow_dispatch:
    inputs:
      appVersion:
        description: "Override --app-version (image tag). Blank = Chart.yaml appVersion."
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

env:
  CHART_DIR: deploy/charts/kube-oidc-proxy

jobs:
  release-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Package & push chart (OCI)
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          APP_VERSION_INPUT: ${{ inputs.appVersion }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY,,}"   # rafpe/kube-oidc-proxy
          OWNER="${REPO%/*}"              # rafpe
          OCI="oci://ghcr.io/${OWNER}/charts"

          helm registry login ghcr.io -u "$ACTOR" -p "$GH_TOKEN"

          CHART_VER="$(helm show chart "$CHART_DIR" | awk '/^version:/{print $2}')"
          APP_VER="$APP_VERSION_INPUT"
          if [ -z "$APP_VER" ]; then
            APP_VER="$(helm show chart "$CHART_DIR" | awk '/^appVersion:/{print $2}' | tr -d '"')"
          fi
          echo "Packaging chart ${CHART_VER} (appVersion ${APP_VER}) -> ${OCI}/kube-oidc-proxy"

          helm package "$CHART_DIR" --app-version "$APP_VER"
          PKG="kube-oidc-proxy-${CHART_VER}.tgz"

          OUT="$(helm push "$PKG" "$OCI" 2>&1)"
          echo "$OUT"
          DIGEST="$(echo "$OUT" | awk '/Digest:/{print $2}')"
          echo "ref=ghcr.io/${OWNER}/charts/kube-oidc-proxy@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (keyless)
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign -y "$REF"
