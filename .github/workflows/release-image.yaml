name: release-image

# Builds and publishes the versioned image and Helm chart for a release tag.
# release.yaml runs this via workflow_call after pushing the tag. The tag-push
# trigger covers manually pushed tags, and workflow_dispatch backfills
# artifacts for an existing tag. A tag pushed by github-actions[bot] is
# release.yaml's own push, already covered by its workflow_call — the job
# guard below skips it so a release cannot publish twice. (GitHub used to
# suppress workflow triggers from GITHUB_TOKEN events entirely, but the
# release PR on 2026-09-01 showed such events do fire now.)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build and publish.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build and publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    # Skip release.yaml's own tag push (chart needs this job, so it skips too).
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # cosign keyless signing
      packages: write # push to ghcr.io
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # full history + tags for version stamping (ldflags)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build binaries (amd64 + arm64) and compute vars
        run: |
          set -euo pipefail
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "-w $(hack/version-ldflags.sh)" \
              -o "bin/${arch}/kube-oidc-proxy" ./cmd/.
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPO }}:latest

      - name: Sign image (keyless, by digest)
        env:
          REPO: ${{ env.REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign -y "ghcr.io/${REPO}@${DIGEST}"

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ env.REPO }}:${{ env.VERSION }}
          format: spdx-json
          output-file: /tmp/sbom.spdx.json

      - name: Attach SBOM to image
        continue-on-error: true
        env:
          REPO: ${{ env.REPO }}
          VERSION: ${{ env.VERSION }}
        run: cosign attach sbom --sbom /tmp/sbom.spdx.json "ghcr.io/${REPO}:${VERSION}"

  chart:
    name: chart
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # cosign keyless signing
      packages: write # push to ghcr.io
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CHART_DIR: chart/kube-oidc-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package, push & sign chart (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          REPO="${GITHUB_REPOSITORY,,}"      # rafpe/kube-oidc-proxy
          OWNER="${REPO%/*}"                 # rafpe
          OCI="oci://ghcr.io/${OWNER}/charts"

          # Keep the Artifact Hub image annotation pinned to this release.
          sed -i -E "s|(image: ghcr.io/${OWNER}/kube-oidc-proxy:).*|\1${VERSION}|" "${CHART_DIR}/Chart.yaml"

          helm registry login ghcr.io -u "$ACTOR" -p "$GH_TOKEN"
          echo "Packaging chart ${VERSION} (appVersion ${VERSION}) -> ${OCI}/kube-oidc-proxy"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION"
          PKG="kube-oidc-proxy-${VERSION}.tgz"

          OUT="$(helm push "$PKG" "$OCI" 2>&1)"
          echo "$OUT"
          DIGEST="$(echo "$OUT" | awk '/Digest:/{print $2}')"
          REF="ghcr.io/${OWNER}/charts/kube-oidc-proxy@${DIGEST}"

          # cosign authenticates via the docker config, which `helm registry
          # login` does not populate — log cosign in to GHCR explicitly.
          echo "${GH_TOKEN}" | cosign login ghcr.io -u "${ACTOR}" --password-stdin
          cosign sign -y "$REF"
