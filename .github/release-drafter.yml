# Configuration for release-drafter, driven by the release/* PR labels.
#
# Every PR merged into main should carry one of the release/* labels; if none
# is present the change defaults to a patch bump (version-resolver below).
#
#   release/major -> next release bumps the major version
#   release/minor -> next release bumps the minor version
#   release/patch -> next release bumps the patch version
#   release/skip  -> no release; the change is collected into the next draft
#
# Publishing the release creates the v* tag, which the release workflow uses to
# build and publish the image and Helm chart (.github/workflows/release-image.yaml).
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'release/major'
  minor:
    labels:
      - 'release/minor'
  patch:
    labels:
      - 'release/patch'
  default: patch

categories:
  - title: '🚨 Breaking changes'
    labels:
      - 'release/major'
  - title: '🚀 Features & improvements'
    labels:
      - 'release/minor'
  - title: '🐛 Fixes'
    labels:
      - 'release/patch'
  - title: '🧹 Housekeeping'
    labels:
      - 'release/skip'

template: |
  ## What changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
