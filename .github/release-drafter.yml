# Configuration for release-drafter, driven by the release/* PR labels.
#
# Every ordinary PR merged into main carries exactly one release/* label,
# enforced by pr-release-metadata.yml.
#
#   release/major -> next release bumps the major version
#   release/minor -> next release bumps the minor version
#   release/patch -> next release bumps the patch version
#   release/skip  -> no version or changelog impact
#
# Prepare Release uses this only to calculate a version and draft notes.
# Publication is exclusively gated by the generated release/next PR.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'release/major'
  minor:
    labels:
      - 'release/minor'
  patch:
    labels:
      - 'release/patch'
  default: patch

categories:
  - title: '🚨 Breaking changes'
    labels:
      - 'release/major'
  - title: '🚀 Features & improvements'
    labels:
      - 'release/minor'
  - title: '🐛 Fixes'
    labels:
      - 'release/patch'
  - title: '🧹 Housekeeping'
    labels:
      - 'release/skip'

template: |
  ## What changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
