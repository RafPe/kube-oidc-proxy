kind: Removed
body: |-
  The `audit.backend.failed`, `audit.flush.failed`, `proxy.hook.failed` and `proxy.hook.completed` log events are removed (the audit flush is reported once, as `audit.flush.completed`), and `kube_oidc_proxy_audit_backend_failures_total` loses its `operation="shutdown"` value. An audit backend that fails to start is reported once as `proxy.startup.failed`. None of the bundled audit backends can report a failed flush, so these never fired for one; a lost flush shows up only as the backend's own error, bridged as a `component=k8s` record.
