kind: Added
body: '`--authentication-config` accepts a second kind, `kube-oidc-proxy.rafpe.github.io/v1alpha1` `AuthenticationConfiguration`. Each issuer has a `name` and an upstream `jwt` entry, and the `name` becomes `issuer_name` in logs and metrics. Two issuers on one host, for example two GKE cluster issuers, can now start with different names. See ADR-0001.'
