kind: Fixed
body: 'A token whose `aud` is null or holds an empty value is now refused before routing, when several issuers share its `iss`. Before, the router read `null` as `""`, alone and in a list. A token with `aud` `null`, `""` or `[]` was already rejected. A token with `aud` `["a", null]` or `["a", ""]` was routed to the issuer with audience `a`. It is now rejected as `audience_unrouted`. The `audience_unrouted` reason is no longer in the reason set of `kube_oidc_proxy_access_decisions_total`. Only the `authn.oidc.failed` log record carries it, and `docs/metrics.md` already left it out.'
