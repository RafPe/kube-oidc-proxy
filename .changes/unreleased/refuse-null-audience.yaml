kind: Fixed
body: 'A token whose `aud` is null or holds an empty value is now refused before routing. Before, the router read `null` as `""`, alone and in a list. The result was the same, because no issuer has an empty audience. The `audience_unrouted` reason is no longer in the reason set of `kube_oidc_proxy_access_decisions_total`. Only the `authn.oidc.failed` log record carries it, and `docs/metrics.md` already left it out.'
