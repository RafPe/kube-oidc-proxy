# Floci, a local AWS emulator, with an nginx TLS front inside the same pod.
#
# Fluent Bit's kinesis_streams output always speaks TLS to its endpoint, and
# Floci serves plain HTTP on 4566, so nginx terminates TLS on 8443 and
# forwards to Floci on localhost. The certificate and the CA that signed it
# are generated by run.sh (Secret floci-tls, ConfigMap floci-ca).
apiVersion: v1
kind: Namespace
metadata:
  name: floci
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: floci-tls-nginx
  namespace: floci
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name floci.floci.svc.cluster.local;
      ssl_certificate     /certs/tls.crt;
      ssl_certificate_key /certs/tls.key;
      client_max_body_size 64m;
      location / {
        proxy_pass http://127.0.0.1:4566;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  namespace: floci
spec:
  replicas: 1
  selector:
    matchLabels: { app: floci }
  template:
    metadata:
      labels: { app: floci }
    spec:
      # Kubernetes injects FLOCI_PORT=tcp://<ip>:4566 for the Service named
      # floci, and Floci reads FLOCI_PORT as its integer port setting, which
      # crashes it. Service links off avoids that.
      enableServiceLinks: false
      containers:
        - name: floci
          image: floci/floci:2.0.1
          ports:
            - { name: http, containerPort: 4566 }
          readinessProbe:
            httpGet: { path: /_floci/health, port: 4566 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
        - name: tls
          image: nginx:1.29.2-alpine
          ports:
            - { name: https, containerPort: 8443 }
          volumeMounts:
            - { name: nginx, mountPath: /etc/nginx/conf.d }
            - { name: certs, mountPath: /certs, readOnly: true }
      volumes:
        - name: nginx
          configMap: { name: floci-tls-nginx }
        - name: certs
          secret: { secretName: floci-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: floci
  namespace: floci
spec:
  selector: { app: floci }
  ports:
    - { name: http, port: 4566, targetPort: 4566 }
    - { name: https, port: 443, targetPort: 8443 }
