{{ $fullname := include "kube-oidc-proxy.fullname" . }}
{{ $defaultTlsSecretName := printf "%s-tls" $fullname }}
{{ $tlsSecretName := .Values.tls.secretName | default $defaultTlsSecretName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oidc-proxy.fullname" . }}
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kube-oidc-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.rollingUpdateStrategy }}
  strategy: {{ .Values.rollingUpdateStrategy | nindent 4}}
  {{ end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret_config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "kube-oidc-proxy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "kube-oidc-proxy.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8443
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        command: ["kube-oidc-proxy"]
        args:
          - "--secure-port=8443"
          - "--tls-cert-file=/etc/oidc/tls/crt.pem"
          - "--tls-private-key-file=/etc/oidc/tls/key.pem"
          {{- if .Values.authenticationConfig.content }}
          - "--authentication-config=/etc/oidc/authentication-config.yaml"
          {{- else }}
          - "--oidc-client-id=$(OIDC_CLIENT_ID)"
          - "--oidc-issuer-url=$(OIDC_ISSUER_URL)"
          - "--oidc-username-claim=$(OIDC_USERNAME_CLAIM)"
          {{- if .Values.oidc.caPEM }}
          - "--oidc-ca-file=/etc/oidc/oidc-ca.pem"
          {{- end }}
          {{- end }}
          {{- if .Values.oidc.tlsClient.existingSecret }}
          - "--oidc-tls-client-cert-file=/etc/oidc/client-tls/tls.crt"
          - "--oidc-tls-client-key-file=/etc/oidc/client-tls/tls.key"
          {{- end }}
          {{- if .Values.readinessRequireAllIssuers }}
          - "--readiness-require-all-issuers"
          {{- end }}
          {{- if and .Values.oidc.usernamePrefix (not .Values.authenticationConfig.content) }}
          - "--oidc-username-prefix=$(OIDC_USERNAME_PREFIX)"
          {{ end }}
          {{- if and .Values.oidc.groupsClaim (not .Values.authenticationConfig.content) }}
          - "--oidc-groups-claim=$(OIDC_GROUPS_CLAIM)"
          {{ end }}
          {{- if and .Values.oidc.groupsPrefix (not .Values.authenticationConfig.content) }}
          - "--oidc-groups-prefix=$(OIDC_GROUPS_PREFIX)"
          {{ end }}
          {{- if and .Values.oidc.signingAlgs (not .Values.authenticationConfig.content) }}
          - "--oidc-signing-algs=$(OIDC_SIGNING_ALGS)"
          {{ end }}
          {{- if not .Values.authenticationConfig.content }}
          {{- range $key, $value := .Values.oidc.requiredClaims }}
          - "--oidc-required-claim={{ $key }}={{ $value }}"
          {{- end }}
          {{- end }}
          {{- if .Values.tokenPassthrough.enabled }}
          - "--token-passthrough"
          {{- if .Values.tokenPassthrough.audiences }}
          - "--token-passthrough-audiences={{ join "," .Values.tokenPassthrough.audiences }}"
          {{ end }}
          {{ end }}
          {{- if ne (toString .Values.subjectAccessReview.cacheAllowTTL) "" }}
          - "--subject-access-review-cache-allow-ttl={{ .Values.subjectAccessReview.cacheAllowTTL }}"
          {{ end }}
          {{- if ne (toString .Values.subjectAccessReview.cacheDenyTTL) "" }}
          - "--subject-access-review-cache-deny-ttl={{ .Values.subjectAccessReview.cacheDenyTTL }}"
          {{ end }}
          {{- if .Values.maxImpersonationHeaderValues }}
          - "--max-impersonation-header-values={{ .Values.maxImpersonationHeaderValues }}"
          {{ end }}
          {{- if .Values.extraImpersonationHeaders.clientIP }}
          - "--extra-user-header-client-ip"
          {{ end }}
          {{- if .Values.extraImpersonationHeaders.headers }}
          - "--extra-user-headers={{ .Values.extraImpersonationHeaders.headers }}"
          {{ end }}
          {{- range $key, $value := .Values.extraArgs -}}
          - "--{{ $key }}={{ $value -}}"
          {{ end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
        {{- if not .Values.authenticationConfig.content }}
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.client-id
        - name: OIDC_ISSUER_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.issuer-url
        - name: OIDC_USERNAME_CLAIM
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.username-claim
        {{- end }}
        {{- if and .Values.oidc.usernamePrefix (not .Values.authenticationConfig.content) }}
        - name: OIDC_USERNAME_PREFIX
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.username-prefix
        {{ end }}
        {{- if and .Values.oidc.groupsClaim (not .Values.authenticationConfig.content) }}
        - name: OIDC_GROUPS_CLAIM
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.groups-claim
        {{ end }}
        {{- if and .Values.oidc.groupsPrefix (not .Values.authenticationConfig.content) }}
        - name: OIDC_GROUPS_PREFIX
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.groups-prefix
        {{ end }}
        {{- if and .Values.oidc.signingAlgs (not .Values.authenticationConfig.content) }}
        - name: OIDC_SIGNING_ALGS
          valueFrom:
            secretKeyRef:
              name: {{ include "kube-oidc-proxy.fullname" . }}-config
              key: oidc.signing-algs
        {{ end }}
        volumeMounts:
          {{- if or .Values.oidc.caPEM .Values.authenticationConfig.content }}
          - name: kube-oidc-proxy-config
            mountPath: /etc/oidc
            readOnly: true
          {{- end }}
          - name: kube-oidc-proxy-tls
            mountPath: /etc/oidc/tls
            readOnly: true
          {{- if .Values.oidc.tlsClient.existingSecret }}
          - name: oidc-client-tls
            mountPath: /etc/oidc/client-tls
            readOnly: true
          {{- end }}
          {{- if .Values.extraVolumeMounts }}{{ toYaml .Values.extraVolumeMounts | trim | nindent 10 }}{{ end }}
      volumes:
        {{- if or .Values.oidc.caPEM .Values.authenticationConfig.content }}
        - name: kube-oidc-proxy-config
          secret:
            secretName: {{ include "kube-oidc-proxy.fullname" . }}-config
            items:
            {{- if .Values.oidc.caPEM }}
            - key: oidc.ca-pem
              path: oidc-ca.pem
            {{- end }}
            {{- if .Values.authenticationConfig.content }}
            - key: authentication-config.yaml
              path: authentication-config.yaml
            {{- end }}
        {{- end }}
        {{- if .Values.extraVolumes }}{{ toYaml .Values.extraVolumes | trim | nindent 8 }}{{ end }}
        - name: kube-oidc-proxy-tls
          secret:
            secretName: {{ $tlsSecretName }}
            items:
            - key: tls.crt
              path: crt.pem
            - key: tls.key
              path: key.pem
        {{- if .Values.oidc.tlsClient.existingSecret }}
        - name: oidc-client-tls
          secret:
            secretName: {{ .Values.oidc.tlsClient.existingSecret }}
            items:
            - key: {{ .Values.oidc.tlsClient.certKey }}
              path: tls.crt
            - key: {{ .Values.oidc.tlsClient.keyKey }}
              path: tls.key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
