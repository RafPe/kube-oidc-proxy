kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
  name: {{ include "kube-oidc-proxy.fullname" . }}
rules:
- apiGroups:
  - ""
  resources:
  - "users"
  - "groups"
  - "serviceaccounts"
  verbs:
  - "impersonate"
- apiGroups:
  - "authentication.k8s.io"
  resources:
  - "userextras/scopes"
  - "userextras/remote-client-ip"
  - "tokenreviews"
  # UID impersonation lives in authentication.k8s.io, unlike users/groups
  # which are core
  - "uids"
  # to support end user impersonation
  - "userextras/authentication.kubernetes.io/credential-id"
  - "userextras/originaluser.jetstack.io-user"
  - "userextras/originaluser.jetstack.io-groups"
  - "userextras/originaluser.jetstack.io-uid"
  - "userextras/originaluser.jetstack.io-extra"
  verbs:
  - "create"
  - "impersonate"
# Inbound impersonation (kubectl --as): the proxy authorizes every
# Impersonate-* header value with a SubjectAccessReview before forwarding.
# Without this grant the review itself is refused and every impersonating
# request fails with 500.
- apiGroups:
  - "authorization.k8s.io"
  resources:
  - "subjectaccessreviews"
  verbs:
  - "create"
{{- $extraKeys := include "kube-oidc-proxy.userExtraKeys" . | fromJsonArray }}
{{- if $extraKeys }}
# Extra user-info keys the proxy forwards as Impersonate-Extra-* headers:
# every claimMappings.extra key in authenticationConfig.content plus
# rbac.userExtras. Each must be granted or the API server rejects the request.
- apiGroups:
  - "authentication.k8s.io"
  resources:
  {{- range $extraKeys }}
  - {{ printf "userextras/%s" . | quote }}
  {{- end }}
  verbs:
  - "impersonate"
{{- end }}
