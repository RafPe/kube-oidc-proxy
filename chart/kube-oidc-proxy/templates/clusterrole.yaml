kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
  name: {{ include "kube-oidc-proxy.fullname" . }}
rules:
# Outbound impersonation: requests are forwarded as the authenticated identity,
# or as the identity kubectl --as asked for, which may be a ServiceAccount.
- apiGroups:
  - ""
  resources:
  - "users"
  - "groups"
  - "serviceaccounts"
  verbs:
  - "impersonate"
# UID impersonation lives in authentication.k8s.io, unlike users and groups
# which are core, and so do the extra keys the proxy sets on its own:
# remote-client-ip (--extra-user-header-client-ip), the
# originaluser.jetstack.io-* keys it adds when it forwards an inbound
# impersonation, and the credential ID the Kubernetes authenticator puts on
# every OIDC identity.
- apiGroups:
  - "authentication.k8s.io"
  resources:
  - "uids"
  - "userextras/remote-client-ip"
  - "userextras/authentication.kubernetes.io/credential-id"
  - "userextras/originaluser.jetstack.io-user"
  - "userextras/originaluser.jetstack.io-groups"
  - "userextras/originaluser.jetstack.io-uid"
  - "userextras/originaluser.jetstack.io-extra"
  verbs:
  - "impersonate"
# Token passthrough: tokens the OIDC authenticator rejects are validated with a
# TokenReview.
- apiGroups:
  - "authentication.k8s.io"
  resources:
  - "tokenreviews"
  verbs:
  - "create"
# Inbound impersonation (kubectl --as): the proxy authorizes every
# Impersonate-* header value with a SubjectAccessReview before forwarding.
# Without this grant the review itself is refused and every impersonating
# request fails with 500.
- apiGroups:
  - "authorization.k8s.io"
  resources:
  - "subjectaccessreviews"
  verbs:
  - "create"
{{- $extraKeys := include "kube-oidc-proxy.userExtraKeys" . | fromJsonArray }}
{{- if $extraKeys }}
# Extra user-info keys the proxy forwards as Impersonate-Extra-* headers:
# every claimMappings.extra key in authenticationConfig.content plus
# rbac.userExtras. Each must be granted or the API server rejects the request.
- apiGroups:
  - "authentication.k8s.io"
  resources:
  {{- range $extraKeys }}
  - {{ printf "userextras/%s" . | quote }}
  {{- end }}
  verbs:
  - "impersonate"
{{- end }}
