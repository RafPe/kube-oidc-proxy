# Default values for kube-oidc-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of proxy replicas to run.
replicaCount: 1

image:
  # Container image repository. Published by this fork's release pipeline.
  repository: ghcr.io/rafpe/kube-oidc-proxy
  # Image tag. Always pin to an explicit version (never "latest") so rollouts
  # are reproducible.
  tag: "1.1.0"
  # Image pull policy. IfNotPresent avoids re-pulling a pinned tag on every start.
  pullPolicy: IfNotPresent

# Names of imagePullSecrets used to pull the image from a private registry.
imagePullSecrets: []
# Override the chart name portion of resource names.
nameOverride: ""
# Override the fully qualified release name used for all resources.
fullnameOverride: ""

service:
  # Kubernetes Service type (ClusterIP, NodePort or LoadBalancer).
  type: ClusterIP
  # Port the Service exposes. Traffic is forwarded to the proxy on 8443.
  port: 443
  annotations:
    # You can use this field to add annotations to the Service.
    # Define it in key-value pairs, e.g.
    # service.beta.kubernetes.io/aws-load-balancer-internal: true

  # Static IP to request when type is LoadBalancer (cloud provider dependent).
  loadBalancerIP: ""
  # CIDR ranges allowed to reach a LoadBalancer Service.
  loadBalancerSourceRanges: []
  # Routing of internal (in-cluster) traffic: "Cluster" (default, all endpoints)
  # or "Local" (only node-local endpoints). Leave empty for the cluster default.
  internalTrafficPolicy: ""
  # Routing of external traffic for NodePort/LoadBalancer Services: "Cluster" or
  # "Local" (preserves client source IP, drops cross-node hops). Ignored for
  # ClusterIP. Leave empty for the default.
  externalTrafficPolicy: ""
  # Topology-aware routing (Kubernetes 1.31+): set to "PreferClose" to prefer
  # endpoints in the same zone, reducing cross-zone traffic/cost. Leave empty to
  # disable. Mutually exclusive with the older topologyKeys.
  trafficDistribution: ""
  # Session stickiness: "ClientIP" pins a client to one backend pod, or "None".
  # Usually unnecessary for this stateless proxy. Leave empty for the default.
  sessionAffinity: ""

# TLS configuration for the proxy's own serving certificate (clients -> proxy).
tls:
  # `secretName` must be the name of a Secret of type kubernetes.io/tls. If not
  # provided a self-signed certificate is generated by the chart.
  secretName:
  # `certManager` set to true if cert-manager is installed and should issue the
  # serving certificate instead of the chart generating one.
  certManager: false
  # `selfSigned` when using cert-manager: create a self-signed Issuer rather than
  # referencing your own. Ignored when certManager is false.
  selfSigned: true
  # `issuerName` when `selfSigned` is false: the name of your own cert-manager
  # Issuer to reference.
  issuerName:

# ---------------------------------------------------------------------------
# Authentication. Choose EXACTLY ONE of the two mutually exclusive modes:
#
#   1. Single-issuer  -> set oidc.clientId / oidc.issuerUrl / oidc.usernameClaim
#                        (and optionally the other oidc.* fields below).
#   2. Multi-issuer   -> set authenticationConfig.content (and optionally
#                        readinessRequireAllIssuers).
#
# When authenticationConfig.content is non-empty the chart passes
# --authentication-config to the proxy and omits issuer-specific --oidc-* flags.
# oidc.tlsClient is shared by all issuers and remains available in either mode.
# ---------------------------------------------------------------------------
oidc:
  # SINGLE-ISSUER (required for mode 1): the OIDC client ID the proxy expects in
  # the token audience. Ignored when authenticationConfig.content is set.
  clientId: ""
  # SINGLE-ISSUER (required for mode 1): the OIDC issuer URL (must serve a
  # discovery document). Ignored when authenticationConfig.content is set.
  issuerUrl: ""
  # SINGLE-ISSUER (required for mode 1): the token claim used as the username
  # (e.g. "email" or "sub"). Ignored when authenticationConfig.content is set.
  usernameClaim: ""

  # PEM-encoded CA certificate used to verify the TLS connection to issuerUrl.
  # If empty, the host's system root CAs are used. Ignored when
  # authenticationConfig.content is set (each issuer's CA is inline in that file).
  caPEM:

  # Optional: prefix prepended to every username to avoid clashes (e.g. "oidc:").
  usernamePrefix:
  # Optional: token claim that carries the user's groups.
  groupsClaim:
  # Optional: prefix prepended to every group name.
  groupsPrefix:

  # JWT signing algorithms the proxy will accept from the issuer.
  signingAlgs:
    - RS256
  # Optional: claims that MUST be present with the given value for a token to be
  # accepted. A map of claim -> required value; each entry is emitted as a
  # repeatable --oidc-required-claim=key=value flag. Empty map => no such flags.
  # Example:
  #   requiredClaims:
  #     hd: example.com
  #     aud: my-client
  requiredClaims: {}

  # Optional client credentials for mutual TLS to the OIDC issuer. These apply
  # to every issuer in both single- and multi-issuer modes. The referenced
  # Secret must contain a matching certificate/key pair. Projected Secret
  # updates are reloaded without restarting the proxy.
  tlsClient:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key

# MULTI-ISSUER (mode 2): accept tokens from several issuers via a Kubernetes
# AuthenticationConfiguration (apiserver.config.k8s.io/v1 or v1beta1).
# Mutually exclusive with issuer-specific oidc.* fields above. oidc.tlsClient
# is shared by every issuer and may be used in this mode.
authenticationConfig:
  # YAML content of an AuthenticationConfiguration resource. When non-empty,
  # --authentication-config is passed to the proxy and the individual --oidc-*
  # flags are omitted. Each issuer's CA must be inline under
  # issuer.certificateAuthority in this content.
  content: ""

# MULTI-ISSUER only: if true, the readiness probe waits for EVERY issuer in
# authenticationConfig.content to initialize (JWKS fetched) before the pod
# reports ready. Default false: ready once at least one issuer initializes, so a
# single IdP outage cannot block a rollout for all other systems. Has no effect
# in single-issuer mode.
readinessRequireAllIssuers: false

# Token passthrough: forward the original bearer token to the API server for
# requests whose token is not an OIDC token the proxy can verify.
# https://github.com/rafpe/kube-oidc-proxy/blob/main/docs/configuration.md#token-passthrough
tokenPassthrough:
  enabled: false
  # Audiences that passthrough tokens are allowed to have.
  audiences: []

# Maximum total number of inbound impersonation header values (kubectl --as)
# the proxy accepts per request: the Impersonate-User value plus every
# Impersonate-Group, Impersonate-Uid and Impersonate-Extra-* value. Each value
# costs one SubjectAccessReview round trip to the API server; requests over the
# cap are rejected with HTTP 431 before any review is sent. Leave empty to use
# the binary's default of 64; set an integer > 0 to pass
# --max-impersonation-header-values explicitly. This caps INBOUND headers from
# clients — unrelated to extraImpersonationHeaders below, which adds OUTBOUND
# extra user headers to forwarded requests.
maxImpersonationHeaderValues:

# Extra impersonation headers added to requests forwarded to the API server.
# https://github.com/rafpe/kube-oidc-proxy/blob/main/docs/configuration.md#extra-impersonation-headers
extraImpersonationHeaders:
  # Send the client's source IP as an extra user header.
  clientIP: false
  #headers: key1=foo,key2=bar,key1=bar

# Arbitrary extra CLI flags passed to the proxy as --<key>=<value>.
extraArgs: {}
  #audit-log-path: /audit-log
  #audit-policy-file: /audit/audit.yaml

# Extra volumeMounts added to the proxy container.
extraVolumeMounts: {}
  #- name: audit
  #  mountPath: /audit
  #  readOnly: true

# Extra volumes added to the pod.
extraVolumes: {}
  #- configMap:
      #defaultMode: 420
      #name: kube-oidc-proxy-policy
    #name: audit

ingress:
  # Enable an Ingress in front of the proxy Service.
  enabled: false
  # Annotations for the Ingress (e.g. ingress class, TLS-ACME).
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # Hosts and paths routed to the proxy Service.
  hosts:
    - host: chart-example.local
      paths: []

  # ingressClassName: ''

  # Ingress TLS blocks (secretName + hosts).
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Deployment update strategy. Uncomment to override the default RollingUpdate.
#rollingUpdateStrategy:
#  type: RollingUpdate
#  rollingUpdate:
#    maxSurge: 34%
#    maxUnavailable: 33%

# PodDisruptionBudget for the proxy Deployment. Recommended with replicaCount>1
# so voluntary disruptions (node drains) keep the proxy available.
podDisruptionBudget:
  enabled: false
  # Set EITHER minAvailable OR maxUnavailable (each may be an integer or a
  # percentage like "50%"). If maxUnavailable is set it takes precedence and
  # minAvailable is omitted.
  minAvailable: 1
  maxUnavailable: ""
  # How the PDB treats not-yet-ready pods during eviction (Kubernetes 1.26+):
  # "IfHealthyBudget" (default) or "AlwaysAllow". Leave empty for the default.
  unhealthyPodEvictionPolicy: ""

# Resource requests/limits for the proxy container.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  #

# Init containers added to the pod.
initContainers: []

# Scheduling controls for the proxy pod.
nodeSelector: {}

tolerations: []

# Node/pod (anti-)affinity. Empty by default. For HA, spread replicas across
# nodes with soft pod anti-affinity, e.g.:
#   affinity:
#     podAntiAffinity:
#       preferredDuringSchedulingIgnoredDuringExecution:
#         - weight: 100
#           podAffinityTerm:
#             topologyKey: kubernetes.io/hostname
#             labelSelector:
#               matchLabels:
#                 app.kubernetes.io/name: kube-oidc-proxy
affinity: {}

# Topology spread constraints for even placement across zones/nodes (preferred
# over anti-affinity for balanced spread). Empty by default, e.g.:
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: ScheduleAnyway
#       labelSelector:
#         matchLabels:
#           app.kubernetes.io/name: kube-oidc-proxy
topologySpreadConstraints: []

# Optional PriorityClass for the proxy pod.
priorityClassName: ""

# Annotations added to the proxy pod template (merged with the chart's own
# checksum/config annotation). Useful for Prometheus scrape hints, etc.
podAnnotations: {}

# Pod-level security context. Hardened by default; override fields or set to {}
# to relax. runAsUser is required because the image sets no USER, so
# runAsNonRoot alone would be rejected by admission.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. Hardened by default.
# readOnlyRootFilesystem assumes the proxy needs no writable rootfs. If you
# enable a feature that writes locally (e.g. audit-log-path to a file), add an
# emptyDir via extraVolumes/extraVolumeMounts and relax this.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
