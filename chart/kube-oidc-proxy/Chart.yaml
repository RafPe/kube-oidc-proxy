apiVersion: v2
name: kube-oidc-proxy
description: >-
  A reverse proxy that authenticates requests using OpenID Connect (OIDC) and
  impersonates the authenticated user against the Kubernetes API server.
  Supports single-issuer (--oidc-* flags) and multi-issuer
  (AuthenticationConfiguration) modes.
type: application
version: 0.4.0
appVersion: "1.1.0"
home: https://github.com/rafpe/kube-oidc-proxy
sources:
  - https://github.com/rafpe/kube-oidc-proxy
maintainers:
  - name: RafPe
    url: https://github.com/RafPe
